image:
  # Local-only / NAS-pinned (PLAN-06 E-03 / audit F-1). Iter-8 flips
  # to ghcr.io. No v-semver tag on NAS yet; pinning to the latest RC.
  # rc4 is the first tag that serves /metrics (BUG-0011).
  repository: 192.168.0.131:5100/scalytics/kafgraph
  tag: "2026.05-rc4"
  pullPolicy: IfNotPresent

replicaCount: 1

# PSA-restricted-compatible defaults (PLAN-06 E-04 / audit F-4).
# readOnlyRootFilesystem is opt-in; KafGraph is a stateful workload
# that needs writable scratch space — validate before flipping.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  httpPort: 7474
  boltPort: 7687
  metricsPort: 9090

# KafGraph env — override for your deployment.
config:
  kafkaBrokers: "ops-foundation-proxy:9092"
  s3:
    endpoint: "minio:9000"
    bucket: "kafgraph"
    accessKey: "scalytics"
    secretKey: "scalytics"
  logLevel: "info"

persistence:
  enabled: true
  storageClass: ""
  size: 5Gi

resources:
  limits: { cpu: 1000m, memory: 1Gi }
  requests: { cpu: 200m, memory: 256Mi }

probes:
  liveness:
    httpGet: { path: /healthz, port: 7474 }
    initialDelaySeconds: 30
    periodSeconds: 20
  readiness:
    httpGet: { path: /healthz, port: 7474 }
    initialDelaySeconds: 10
    periodSeconds: 10

serviceAccount:
  create: true
  name: ""

# Prometheus metrics + ServiceMonitor (PLAN-06 iter-7 E-12 / G-007).
#
# IMPORTANT: kafgraph binary does not yet serve /metrics; the binary
# needs a promhttp.Handler() registered. Tracked as BUG-0011 in
# scalytics-all-in-one-meta/BUGS/. The template ships gated by
# `metrics.enabled` (default false) so the chart layer is audit-clean;
# flip on after BUG-0011 closes.
metrics:
  # BUG-0011: enabled now that the rc4 image serves /metrics (promhttp).
  enabled: true
  path: "/metrics"
  port: 7474
  serviceMonitor:
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

labels:
  app.kubernetes.io/part-of: ops-foundation
