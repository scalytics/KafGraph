image:
  # Local-only / NAS-pinned (PLAN-06 E-03 / audit F-1). Iter-8 flips
  # to ghcr.io. No v-semver tag on NAS yet; pinning to the latest RC.
  repository: 192.168.0.131:5100/scalytics/kafgraph
  tag: "2026.05-rc2"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  httpPort: 7474
  boltPort: 7687
  metricsPort: 9090

# KafGraph env — override for your deployment.
config:
  kafkaBrokers: "ops-foundation-proxy:9092"
  s3:
    endpoint: "minio:9000"
    bucket: "kafgraph"
    accessKey: "scalytics"
    secretKey: "scalytics"
  logLevel: "info"

persistence:
  enabled: true
  storageClass: ""
  size: 5Gi

resources:
  limits: { cpu: 1000m, memory: 1Gi }
  requests: { cpu: 200m, memory: 256Mi }

probes:
  liveness:
    httpGet: { path: /healthz, port: 7474 }
    initialDelaySeconds: 30
    periodSeconds: 20
  readiness:
    httpGet: { path: /healthz, port: 7474 }
    initialDelaySeconds: 10
    periodSeconds: 10

serviceAccount:
  create: true
  name: ""

labels:
  app.kubernetes.io/part-of: ops-foundation
